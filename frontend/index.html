<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlacementPro | Student Placement Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">PlacementPro</div>
    <div class="tag">Student Placement Management</div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Placement Dashboard</h1>
        <p>Manage students, companies and placement applications in one place.</p>
      </div>
      <button onclick="loadStudents()">Refresh Data</button>
    </section>

    <section class="cards">
      <div class="card"><span>Total Students</span><strong id="studentCount">0</strong></div>
      <div class="card"><span>Companies</span><strong id="companyCount">0</strong></div>
      <div class="card"><span>Applications</span><strong id="applicationCount">0</strong></div>
    </section>

    <section class="panel">
      <h2>Add Student</h2>
      <form id="studentForm">
        <input id="name" placeholder="Student name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="branch" placeholder="Branch (e.g. CSE)" required>
        <input id="cgpa" type="number" step="0.01" min="0" max="10" placeholder="CGPA" required>
        <button type="submit">Add Student</button>
      </form>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Students</h2>
        <input id="search" placeholder="Search students..." oninput="renderStudents()">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Branch</th><th>CGPA</th></tr></thead>
          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>PlacementPro • Built with HTML, CSS, JavaScript, Flask and SQLite</footer>
  <script src="script.js"></script>
</body>
</html>
